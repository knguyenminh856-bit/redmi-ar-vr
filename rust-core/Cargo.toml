[package]
name = "ar_vr_core"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight Rust + OpenGL ES 3.0 stereo passthrough AR/VR renderer for Redmi Note 14 4G"

[lib]
name = "ar_vr_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = "0.29"
glow = "0.16"
jni = "0.21"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
