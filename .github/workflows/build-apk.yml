name: Build & Package Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Rust arm64-v8a + Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust toolchain (arm64-v8a)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Ensure Android NDK 27 & SDK 34
        shell: bash
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Run Rust unit tests
        working-directory: rust-core
        run: cargo test

      - name: Compile Rust native library (arm64-v8a release)
        working-directory: rust-core
        run: cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare output APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RedmiNote14-ARVR-debug.apk
          ls -lh RedmiNote14-ARVR-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedmiNote14-ARVR-APK
          path: RedmiNote14-ARVR-debug.apk
          retention-days: 30

      - name: Update rolling latest-apk tag
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa latest-apk -m "Latest APK build (${{ github.sha }})"
          git push origin latest-apk --force

      - name: Publish rolling GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Latest APK Build (Redmi Note 14 4G)"
          prerelease: true
          body: |
            Bản build tự động cho **Xiaomi Redmi Note 14 4G (`arm64-v8a`)**.
            Tải trực tiếp file `RedmiNote14-ARVR-debug.apk` bên dưới về điện thoại để cài đặt.
          files: RedmiNote14-ARVR-debug.apk
